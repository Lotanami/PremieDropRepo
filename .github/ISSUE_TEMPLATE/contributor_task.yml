name: Contributor task
description: Claim or propose a code/design task.
title: "[Task]: "
labels:
  - help wanted
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      placeholder: What do you want to work on?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant files
      placeholder: Link any files or issues related to the task.
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      placeholder: How are you thinking about solving it?
  - type: checkboxes
    id: checks
    attributes:
      label: Before opening a PR
      options:
        - label: I checked for an existing issue or PR.
        - label: I can keep the change focused.
        - label: I can include screenshots/video if this changes UI.
